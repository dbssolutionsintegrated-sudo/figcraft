name: web-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/web-image.yml
      - apps/figcraft-web/**
      - crates/**
      - deploy/web.Dockerfile

permissions:
  contents: read
  packages: write

jobs:
  build:
    # the panel host is arm64; build natively so nothing is emulated
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      - name: trunk
        run: |
          set -euo pipefail
          V=$(curl -sSfL https://api.github.com/repos/trunk-rs/trunk/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${V}/trunk-aarch64-unknown-linux-gnu.tar.gz" | tar -xzf - -C /usr/local/bin
          trunk --version

      - name: binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: build
        run: cd apps/figcraft-web && trunk build --release

      - name: size gate
        run: |
          du -sh dist/web
          for f in dist/web/*.wasm; do echo "$f: $(wc -c <"$f") bytes"; done

      - name: image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/figcraft-web
          docker build -f deploy/web.Dockerfile -t $IMG:0.6.0 -t $IMG:latest .
          docker push --all-tags $IMG
